      "slug": "advancements-in-robotic-surgery",
      "title": "Advancements in Robotic Surgery",
      "author": "Arnav Maskey",
      "topic": "Cardiology",
      "publishedDate": "2025-04-18",
      "readTime": "3 min read",
      "aiSummary": "Robotic-assisted surgery offers surgeons greater precision and stability through robotic arms and 3D imaging, but adoption is slowed by high costs, a steep learning curve, and reduced tactile feedback compared to traditional hands-on surgery.",
      "content": [
        "Today, rather than focusing solely on advances in technology for Cardiology, a form of medical technology that can not only be heart related but essential for all human body systems has been garnering attention. An important development in medical technology is that of surgery robots which can bring increased efficiency and a plethora of benefits to institutions that utilize this new form of medical technology. However, considering how new this technology is to the market, before implementation can occur, it is essential that the pros and the cons of this development are weighed effectively for institutions to make the best possible decision moving forward for the sake of patient safety.",
        "Robotic surgery has three main features that it brings to institutions that use it each with a great number of benefits. Robotic surgery provides robotic \"arms\" which are the main way that the surgeons are able to interact with the patient. The arms can hold tiny surgical instruments which are to be used and offer a sleek design and precision that can have more stability than human hands and approach more areas in an easier fashion. Alongside the arms, a high-definition camera is attached as well. This offers surgeons a way to view the surgical area in highly defined 3D video that misses near none details. The surgeons' control all of this through a console where the surgeons can control the positioning of the arms and cameras through the controls on the console which are very similar to joysticks.",
        "A common misconception that arises is that these machines are going to replace surgeons; this is not the case. These machines are added tools to improve the effectiveness of such procedures and with advancements in technology, there is bound to be an advancement of methods used in order to support an increase in the quality of health services alongside the improvements in technology. Surgeons are not inexperienced when using this new technology, they are provided training on how to perform robot-assisted procedures through robotic surgery fellowships.",
        "There are many advantages to this new method, but alongside it there are disadvantages that come alongside them. Many disadvantages are related to the technology being relatively new that could be overcome with time and widespread implementation. These include a learning curve that requires surgeons to become proficient in using robotic systems, limited availability due to its new implementation, and ethical and legal considerations because of the relatively unknown field that is brought alongside robotic surgery. Additionally, disadvantages related to the practice itself include a higher cost associated with maintaining and constructing robotic surgical systems as well as providing necessary training to surgeons who would use this method, potential of mechanical malfunctions as systems are complex, and a malfunction during surgery could lead to fatal outcomes, lack of interaction as the surgeon uses a camera to view the surgery site and cannot touch and analyze the site in person, leading to gaps in information, and finally size and space restrictions due to the large scale of surgical systems.",
        "Robotic surgery is a new upcoming field that improves many aspects of surgical procedure but adds a new dimension of factors that need to be considered if this technology is to be adapted across multiple institutions, especially for institutions that perform lifesaving operations; putting faith in new systems is never easy. It is important to follow developments in robotic surgery and to see future improvements that could lead to widespread implementation and improved quality of health services."
      ],

      "slug": "rna-therapeutics-2-coronary-bypass-surgery",
      "title": "RNA Therapeutics 2 - Coronary Bypass Surgery",
      "author": "Arnav Maskey",
      "topic": "Cardiology",
      "publishedDate": "2024-10-05",
      "readTime": "1 min read",
      "aiSummary": "RNA therapeutics that prompt the body to produce VEGF-A, a protein that promotes blood vessel growth, may help patients undergoing coronary bypass surgery. Newer 'naked RNA' delivery appears to avoid the leaky-vessel side effects seen in earlier VEGF-A trials.",
      "content": [

      "content": [
        "Predicting and preventing future cardiovascular diseases is extremely important as if something is left undetected, it becomes worse and eventually fatal for patients. Cardiovascular diseases are often life threatening and once they happen, there is little that can be done to stop it. Instead, there needs to be a way to detect the future presence of the disease in order to prepare the individual for the treatment to come.",
        "One way to do this is by looking at how specific patient's blood platelets behave. Blood platelets that are hyperactive are likely to clump together and form blood clots causing atherothrombosis which is the buildup of fatty deposits known as atheroma on the arterial walls. The hyperactive blood platelets then are an indication of this condition which is known to cause deadly complications such as heart attacks and strokes. This is a condition already well known, however, finding which specific patients contain hyperactive blood platelets is more difficult, and discovering how to identify such conditions would potentially save many lives.",
        "Genetic testing can be used in order to identify differences among genes of patients who have hyperactive platelets and those who do not. The technology used is PRESS, the Platelet Reactivity ExpreSsion Score, which is able to detect and identify the reactivity of platelets based on genetic signatures. It can be used to successfully identify those who are at risk of future cardiovascular diseases and therefore can help reveal candidates for treatments such as antiplatelet therapy.",
        "In tests, PRESS was able to identify hyperreactive phenotypes in those with peripheral artery disease or PAD, and PAD patients after the PRESS test that received a score above the median were correctly identified as patients who had high risk of developing a cardiovascular disease in the future. PRESS testing was also able to identify that PAD patients with hyperactive blood platelets were likely to have diabetes. Additionally, PAD patients with hyperactive blood platelets were often associated with gangrene or the death of body tissue which is caused by lack of blood flow. PRESS also was tested in a sample of patients who were healthy, and it performed well as PRESS successfully did not detect any abnormalities within the healthy cohort.",
        "Thanks to PRESS testing, it is easier to detect patients who have hyperactive blood platelets and additionally it is possible to assign symptoms to hyperactive blood platelets such as diabetes and gangrene, however despite this success, PRESS is not yet on a point-of-care testing level.",

      "content": [
        "An important technology that must be considered for the future of cardiovascular health is that of RNA therapeutics. RNA therapeutics is technology that can alter gene expressions, providing medical aid beyond that of traditional medicine.",
        "Historically, cardiovascular diseases aren't easily treatable or unaffected from regular pharmacy drugs and standard medication. How this technology works is that the RNA therapeutics that can alter gene expression needs a form of transport, known as a vector, able to successfully be implemented in the proper location. This in mind, in order to treat cardiovascular specific diseases, a vector needs to be chosen that already targets cardiovascular areas. A vector commonly used is adeno associated viruses, or AAVs.",

        "Usage of AAV to access the cardiac myocytes can help the body in a multitude of therapeutic ways to assist with heart health. One example of such aid would be enhanced myocyte proliferation, a process when cardiac myocytes multiply. This process usually does not continue after birth and most organisms are stuck with the same number of cardiac myocytes and the number can only decrease. This enhanced myocyte proliferation is essential to provide aid to patients who have experienced myocardial infarction, when blood flow to heart is stopped, causing cell death, especially that of cardiac myocytes. After myocardial infarction the cardiac myocytes do not come back and are replaced with scar tissue that does not retain the same functionality as cardiac myocytes, unable to contract properly, causing reduced blood flow and increased stress on the heart, worsening the life of the affected patient.",

      "slug": "attr-cm-and-amvuttra-a-brief-overview",
      "title": "ATTR-CM and AMVUTTRA; a brief Overview",
      "author": "Arnav Maskey",
      "topic": "Cardiology",
      "publishedDate": "2025-03-21",
      "readTime": "2 min read",
      "aiSummary": "ATTR-CM is caused by misfolded transthyretin protein clumping in heart muscle. AMVUTTRA, an RNA-interference injection, reduced TTR protein levels by 87% in clinical studies and lowered cardiovascular hospitalization and death risk for patients with the disease.",
      "content": [
        "ATTR-CM is a disease where a protein called transthyretin (TTR) folds incorrectly. An incorrect folding causes a change in the protein's structure. This causes clumping together and creates amyloid deposits. These amyloid deposits are essentially formed when the proteins in the body clump together and create insoluble fibrils. These can accumulate in many different organs and can lead to life threatening conditions. Specifically, the folding of TTR causes these clumps to form in the heart muscle. This has the direct effect of making the heart muscle stiffer and making its ability to pump blood worse. This can be life threatening, and initial symptoms include shortness of breath, fatigue, arrhythmias, leg swelling, and fainting.",
        "There are multiple ways to get ATTR-CM. One is caused by heredity, while the other is a Wild type. The hereditary version of ATTR-CM is hATTR-CM which is caused by a mutation in the TTR gene, tightly overlapping with other cardiac diseases such as hypertensive heart disease.",
        "There is hope however for patients who have ATTR-CM thanks to the treatment AMVUTTRA. AMVUTTRA is a subcutaneous injection treatment, now approved for clinical use for patients who have the ATTR-CM disease and irregularities in the TTR protein. This is done through RNA interference, degrading mRNA for TTR. This reduces the production of TTR in the liver, meaning that the amount of TTR that could be misfolded is reduced, therefore the amount of amyloid clumping is also reduced. Clinical studies show that in 6 weeks with a 2.5-year range, that there was an 87% reduction in overall TTR levels. This causes there to be less fatality as there aren't enough clumps to cause severe symptoms. Clinical studies have shown that AMVUTTRA has been largely successful as most patients have reduced risk of cardiovascular hospitalization, and thankfully, death."
      ],

        "AI is used for preoperative planning in surgery currently such as 3D modeling of a patient's heart to simulate device fitting, but there are future avenues for AI in surgery that Yale seeks to tap into. AI, according to Marc Pelletier, could be used as a co-pilot during surgery, providing real time alerts during operation such as warning if a tool is too close to a vulnerable structure, while still the surgeon maintains control, providing a relationship that can deliver higher patient satisfaction.",

    var paragraphs = a.content.map(function (p) {
      var isSubhead = p.length < 70 && !/[.!?]$/.test(p.trim());
      return '<p' + (isSubhead ? ' class="subhead"' : '') + '>' + esc(p) + '</p>';
    }).join('');
    var sources = (a.sources || []).map(function (s) {
      return '<a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.label) + ' ↗</a>';
    }).join('');
    return (
      '<span class="badge-topic ' + topicClass(a.topic) + '">' + esc(a.topic) + '</span>' +
      '<h2 class="page-title">' + esc(a.title) + '</h2>' +
      '<div class="meta-row">By ' + byline(a) + '</div>' +
      (a.aiSummary ? '<div class="ai-summary"><div class="label">AI Quick Summary</div><p>' + esc(a.aiSummary) + '</p></div>' : '') +
      '<div class="article-body">' + paragraphs + '</div>' +
      (sources ? '<div class="sources-list"><div class="label">Sources</div>' + sources + '</div>' : '')
    );
  }
 
  function renderHome() {
    if (!articles.length) {
      app.innerHTML = '<h2 class="page-title">No articles yet</h2><p>Check back soon for the first issue.</p>';
      return;
    }
    var latest = articles[0];
    var recent = articles.slice(1, 7).map(articleTeaser).join('');
    app.innerHTML =
      '<div class="home-hero">' +
        '<span class="badge-topic ' + topicClass(latest.topic) + '">' + esc(latest.topic) + '</span>' +
        '<h2>' + esc(latest.title) + '</h2>' +
        '<div class="meta-row">By ' + byline(latest) + '</div>' +
        (latest.aiSummary ? '<p class="summary">' + esc(latest.aiSummary) + '</p>' : '') +
        '<a class="btn" href="#/article/' + esc(latest.slug) + '">Read the full article →</a>' +
      '</div>' +
      (recent ? '<h3 style="font-family: var(--serif); font-size: 18px; margin-bottom: 6px;">More from MedIntel</h3><ul class="article-list">' + recent + '</ul>' : '') +
      '<p style="margin-top:18px;"><a href="#/archive">Browse the full archive →</a></p>';
  }
 
  function renderArticle(slug) {
    var a = articles.filter(function (x) { return x.slug === slug; })[0];
    if (!a) {
      app.innerHTML = '<h2 class="page-title">Article not found</h2><p><a href="#/">Back to Home</a></p>';
      return;
    }
    app.innerHTML = renderArticleBody(a);
  }
 
  function renderArchive() {
    var topics = ['All'].concat(articles.map(function (a) { return a.topic; }).filter(function (t, i, arr) { return arr.indexOf(t) === i; }));
    var filtered = archiveFilter === 'All' ? articles : articles.filter(function (a) { return a.topic === archiveFilter; });
    var filterBtns = topics.map(function (t) {
      return '<button class="filter-btn' + (t === archiveFilter ? ' active' : '') + '" data-topic="' + esc(t) + '">' + esc(t) + '</button>';
    }).join('');
    var items = filtered.length ? filtered.map(articleTeaser).join('') : '<p>No articles in this category yet.</p>';
    app.innerHTML =
      '<div class="eyebrow">Archive</div>' +
      '<h2 class="page-title">Every article</h2>' +
      '<div class="filter-row">' + filterBtns + '</div>' +
      '<ul class="article-list">' + items + '</ul>';
    var btns = app.querySelectorAll('.filter-btn');
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener('click', function (e) {
        archiveFilter = e.currentTarget.getAttribute('data-topic');
        renderArchive();
      });
    }
  }
 
  function renderAbout() {
    var contributorItems = contributors.length
      ? contributors.map(function (c) {
          return (
            '<li>' +
              '<div class="c-name">' + esc(c.name) + '</div>' +
              '<div class="c-role">' + esc(c.role) + '</div>' +
              (c.bio ? '<div class="c-bio">' + esc(c.bio) + '</div>' : '') +
            '</li>'
          );
        }).join('')
      : '<li><div class="c-bio">Contributor bios will appear here once added.</div></li>';
 
    app.innerHTML =
      '<div class="eyebrow">About</div>' +
      '<h2 class="page-title">Our Mission</h2>' +
      '<div class="about-content">' +
        '<p>Our team is dedicated to providing a weekly digest of notable developments in medical and scientific research. We cover clinical trials, drug approvals, public-health surveillance, and developments in medical technology.</p>' +
        '<h3>How stories are selected</h3>' +
        '<p>Each week, our contributors find reputable primary and secondary sources (regulatory agencies like the FDA and CDC, peer-reviewed journals, and major research institutions, and established science journalism).</p>' +
        '<p>We feature original articles written by contributors. Each student writes and submits a draft, which is reviewed by the MedIntel editorial team before publishing. These pieces reflect each writer’s own research and perspective and are clearly bylined as student-authored.</p>' +
        '<h3>Our contributors</h3>' +
        '<ul class="contributor-list">' + contributorItems + '</ul>' +
        '<h3>Sourcing</h3>' +
        '<p>Every story links to the sources it was built from so you can read the original reporting or research yourself.</p>' +
        '<div class="disclaimer"><strong>Not medical advice.</strong> MedIntel is an educational publication. Nothing here provides individualized medical advice, and nothing here should be used to start, stop, or change any medication or treatment. Talk to a qualified healthcare provider about your own health.</div>' +
      '</div>';
  }
 
  function setActiveNav(route) {
    var links = document.querySelectorAll('#main-nav a');
    for (var i = 0; i < links.length; i++) {
      var r = links[i].getAttribute('data-route');
      var isActive = route === r || (route.indexOf('/article/') === 0 && r === '/');
      links[i].classList.toggle('active', isActive);
    }
  }
 
  function router() {
    var hash = location.hash.replace(/^#/, '') || '/';
    window.scrollTo(0, 0);
    if (hash === '/') { renderHome(); setActiveNav('/'); }
    else if (hash === '/archive') { renderArchive(); setActiveNav('/archive'); }
    else if (hash === '/about') { renderAbout(); setActiveNav('/about'); }
    else if (hash.indexOf('/article/') === 0) { renderArticle(hash.replace('/article/', '')); setActiveNav(hash); }
    else { renderHome(); setActiveNav('/'); }
  }
 
  window.addEventListener('hashchange', router);
  router();
})();
</script>
</body>
</html>
